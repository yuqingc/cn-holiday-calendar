name: Test and publish holiday calendar

on:
  push:
    branches: [main, 'implementation/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # Lunar dates are expanded for a 21-year window. Refresh annually.
    - cron: '17 3 1 1 *'

permissions:
  contents: write

concurrency:
  group: holiday-calendar-${ github.ref }
  cancel-in-progress: false

jobs:
  test-build-validate:
    name: Node.js ${{ matrix.node-version }} / test-build-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript type-check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Generate ICS
        run: npm run generate
      - name: Validate generated ICS
        run: npm run validate
      - name: Publish generated artefacts
        if: matrix.node-version == 22 && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json dist/holidays.ics
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate holiday calendar'
            git push
          fi
